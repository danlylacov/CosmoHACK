        swpc_mpsh_differential_electrons_g19_0_378_keV:
          type: [number, "null"]
        swpc_mpsh_differential_electrons_g19_0_548_keV:
          type: [number, "null"]
        swpc_mpsh_differential_electrons_g19_0_865_keV:
          type: [number, "null"]
        swpc_mpsh_differential_electrons_g19_0_1509_keV:
          type: [number, "null"]
        swpc_mpsh_differential_electrons_g19_0_2205_keV:
          type: [number, "null"]
        swpc_mpsh_differential_electrons_g19_0_2894_keV:
          type: [number, "null"]
        swpc_mpsh_integral_electrons_g19_0_ge2_MeV:
          type: [number, "null"]
          description: Интегральные электроны ≥2 МэВ
        swpc_sgps_differential_protons_g19_0_P1:
          type: [number, "null"]
          description: 1.02–1.86 МэВ
        swpc_sgps_differential_protons_g19_0_P2A:
          type: [number, "null"]
        swpc_sgps_differential_protons_g19_0_P2B:
          type: [number, "null"]
        swpc_sgps_differential_protons_g19_0_P3:
          type: [number, "null"]
        swpc_sgps_differential_protons_g19_0_P4:
          type: [number, "null"]
        swpc_sgps_differential_protons_g19_0_P5:

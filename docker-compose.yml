services:
  data-aggregator:
    build:
      context: ./data-aggregator
      dockerfile: Dockerfile
    image: data-aggregator:local
    container_name: data-aggregator
    ports:
      - "8088:8088"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8088/ch/data-aggregator/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  sepnet-sgr:
    build:
      context: ./ML
      dockerfile: Dockerfile
    image: sepnet-sgr:local
    container_name: sepnet-sgr
    ports:
      - "8002:8002"
    environment:
      PORT: "8002"
    volumes:
      - sepnet-datasets:/app/data/datasets
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/health', timeout=3)",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: unless-stopped

volumes:
  sepnet-datasets:
